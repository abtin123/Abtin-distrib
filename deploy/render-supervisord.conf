[supervisord]
nodaemon=true
logfile=/tmp/abtin-supervisord.log
pidfile=/tmp/abtin-supervisord.pid

[program:backend]
directory=/app/backend
command=/bin/sh -c "python3 manage.py migrate --noinput && python3 manage.py seed_demo_data --password \"$${SEED_DEFAULT_PASSWORD:-Demo-Strong-Password-2026!}\" && python3 manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
environment=DJANGO_SETTINGS_MODULE="config.settings.prod"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/app/frontend
command=/bin/sh -c 'exec npm run dev -- --host 0.0.0.0 --port "${PORT:-10000}"'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
