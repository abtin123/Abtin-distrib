name: Deploy to Cloudflare (no Wizard)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SECURE_PATH
            VLESS_UUID
            TROJAN_PASS
            CF_EMAIL
        env:
          SECURE_PATH: ${{ secrets.SECURE_PATH }}
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
          TROJAN_PASS: ${{ secrets.TROJAN_PASS }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
