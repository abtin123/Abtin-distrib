name = "bpb-panel"
main = "dist/worker.js"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[build]
command = "npm run build"

# KV is auto-provisioned on first `wrangler deploy` (wrangler >= 4.45).
# The binding name MUST stay "kv".
[[kv_namespaces]]
binding = "kv"

# Required (set as Secrets, NOT here):  SECURE_PATH, VLESS_UUID, TROJAN_PASS
# Optional: CF_ACCOUNT_ID, CF_EMAIL (panel login user), CF_API_TOKEN (self-update/usage),
#           MAIN_DOMAIN, PROXY_IP_MODE, PROXY_IPS, NAT64_PREFIXES, FALLBACK, DOH_URL
